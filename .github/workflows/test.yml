name: test

on:
  push:
    branches: main
  pull_request:

permissions:
  contents: read

jobs:
  shellspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Show Podman version
        run: podman version

      - name: Install crun matching the Podman version
        run: |
          sudo curl -fsSL -o /usr/bin/crun https://github.com/containers/crun/releases/download/1.28/crun-1.28-linux-amd64
          sudo chmod +x /usr/bin/crun
          crun --version

      - name: Install ShellSpec
        run: git clone --depth 1 --branch 0.28.1 https://github.com/shellspec/shellspec.git "${RUNNER_TEMP}/shellspec"

      - name: Run ShellSpec
        run: "${RUNNER_TEMP}/shellspec/shellspec"
