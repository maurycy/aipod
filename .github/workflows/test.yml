name: test

on:
  push:
    branches: main
  pull_request:

permissions:
  contents: read

jobs:
  shellspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Show Podman version
        run: podman version

      - name: Install ShellSpec
        run: git clone --depth 1 --branch 0.28.1 https://github.com/shellspec/shellspec.git "${RUNNER_TEMP}/shellspec"

      - name: Run ShellSpec
        run: "${RUNNER_TEMP}/shellspec/shellspec"
